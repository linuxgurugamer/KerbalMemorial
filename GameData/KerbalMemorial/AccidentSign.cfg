// In-game Sign Settings overrides widthMeters, heightAboveFloor and postMounted in PluginData/SignSettings.cfg.
// postMounted = true uses two floor-mounted posts; false mounts the sign against the wall.
// Separate layouts for the VAB and SPH. Restart KSP after editing.
// widthMeters = 0 uses widthMultiplier (relative to the flag width).
// A positive widthMeters overrides widthMultiplier, preserving the aspect ratio.
// heightAboveFloor is the clearance from the floor to the BOTTOM of the sign, in meters.
// The floor is detected from scenery colliders. Optional floorY overrides detection
// with an absolute world Y coordinate (meters). If detection fails, world Y=0 is used.
// Set heightAboveFloor = -1 to use the old flag-relative gapMultiplier instead.
// gapMultiplier, horizontalOffset and depthOffset are multiples of the flag width.
KERBAL_MEMORIAL_SIGN
{
    VAB
    {
        postMounted = true
        widthMultiplier = 0.45
        widthMeters = 0
        heightAboveFloor = 2
        // floorY = 0
        gapMultiplier = 0.05
        horizontalOffset = 0
        depthOffset = 0
    }
    SPH
    {
        postMounted = true
        widthMultiplier = 0.45
        widthMeters = 0
        heightAboveFloor = 2
        // floorY = 0
        gapMultiplier = 0.05
        horizontalOffset = 0
        depthOffset = 0
    }
}

// Outdoor signs in flight at the home space center. Independent of editor
// sign settings. Front bearing is clockwise from geographic north.
// Signs sit near the sign-right edge of the building frontage. Positive lateral
// offset moves inward from that edge; negative moves outward. Front offset is
// clearance from the rear supports to the detected facade, measured outward.
// Each child node defines one site. buildingId overrides automatic matching.
// Use a distinct node name and the exact building ID for each additional site.
// xOffsetMeters and yOffsetMeters add geographic east and north offsets (m).
// rotationDegrees is the independent sign-facing compass bearing (0=north, 90=east).
// postMounted = false removes the posts; use offsets to align the board with a wall.
// Flight Outdoor Accident Sign Settings saves offsets, rotation, dimensions and mounting
// in PluginData/OutdoorSignSettings.cfg.
// Restart KSP after editing the base configuration.
KERBAL_MEMORIAL_OUTDOOR_SIGN
{
    RandD
    {
        enabled = true
        postMounted = true
        widthMeters = 4
        heightAboveGround = 1
        frontBearing = 90
        frontOffsetMeters = 1
        lateralOffsetMeters = 1
        xOffsetMeters = -37
        yOffsetMeters = -56
        rotationDegrees = 270
        buildingId = SpaceCenter/ResearchAndDevelopment/Facility/MainBuilding
    }
    VAB
