// In-game Sign Settings overrides widthMeters and heightAboveFloor in PluginData/SignSettings.cfg.
// Separate layouts for the VAB and SPH. Restart KSP after editing.
// widthMeters = 0 uses widthMultiplier (relative to the flag width).
// A positive widthMeters overrides widthMultiplier, preserving the aspect ratio.
// heightAboveFloor is the clearance from the floor to the BOTTOM of the sign, in meters.
// The floor is detected from scenery colliders. Optional floorY overrides detection
// with an absolute world Y coordinate (meters). If detection fails, world Y=0 is used.
// Set heightAboveFloor = -1 to use the old flag-relative gapMultiplier instead.
// gapMultiplier, horizontalOffset and depthOffset are multiples of the flag width.
KERBAL_MEMORIAL_SIGN
{
    VAB
    {
        widthMultiplier = 0.45
        widthMeters = 0
        heightAboveFloor = 2
        // floorY = 0
        gapMultiplier = 0.05
        horizontalOffset = 0
        depthOffset = 0
    }
    SPH
    {
        widthMultiplier = 0.45
        widthMeters = 0
        heightAboveFloor = 2
        // floorY = 0
        gapMultiplier = 0.05
        horizontalOffset = 0
        depthOffset = 0
    }
}
